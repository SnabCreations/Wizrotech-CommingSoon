<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Wizrotech — Coming Soon</title>
    <!-- Google Fonts for modern typography -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@300;400;500;600;800&display=swap" rel="stylesheet">
    
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Plus Jakarta Sans', sans-serif;
            background: linear-gradient(135deg, #070b14 0%, #0c1836 50%, #03050b 100%);
            color: #ffffff;
            height: 100vh;
            overflow: hidden;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            align-items: center;
            position: relative;
        }

        /* Subtle clean background glow */
        .glow-orb {
            position: absolute;
            width: 600px;
            height: 600px;
            background: radial-gradient(circle, rgba(37, 99, 235, 0.15) 0%, rgba(14, 116, 144, 0) 70%);
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            z-index: 1;
            pointer-events: none;
        }

        /* Top Minimal Notification Bar */
        header {
            z-index: 10;
            padding-top: 2.5rem;
        }

        .badge {
            display: inline-flex;
            align-items: center;
            padding: 0.5rem 1.25rem;
            background: rgba(255, 255, 255, 0.04);
            border: 1px solid rgba(255, 255, 255, 0.08);
            backdrop-filter: blur(12px);
            border-radius: 50px;
            font-size: 0.8rem;
            font-weight: 500;
            letter-spacing: 0.08em;
            text-transform: uppercase;
            color: #93c5fd;
            box-shadow: 0 4px 20px rgba(0, 0, 0, 0.2);
            animation: fadeInDown 1s ease-out;
        }

        /* Center Section: Giant Full-Sized Letter W */
        main {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            display: flex;
            justify-content: center;
            align-items: center;
            z-index: 2;
            pointer-events: none;
        }

        .giant-w {
            font-size: clamp(28vw, 48vh, 70vw);
            font-weight: 800;
            line-height: 1;
            background: linear-gradient(180deg, rgba(255, 255, 255, 0.06) 0%, rgba(59, 130, 246, 0.01) 100%);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            user-select: none;
            letter-spacing: -0.05em;
            transform: translateY(5%);
        }

        /* Foreground Content layered over the giant W */
        .content-container {
            z-index: 5;
            text-align: center;
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 1.25rem;
            padding: 0 1rem;
            margin-bottom: 8vh;
            animation: fadeInUp 1.2s cubic-bezier(0.16, 1, 0.3, 1);
        }

        .brand-title {
            font-size: clamp(2rem, 4vw, 3.5rem);
            font-weight: 800;
            letter-spacing: -0.03em;
            background: linear-gradient(to right, #ffffff, #93c5fd);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }

        .brand-subtitle {
            font-size: clamp(0.95rem, 1.5vw, 1.15rem);
            color: #94a3b8;
            font-weight: 300;
            max-width: 400px;
            line-height: 1.6;
        }

        /* Clean Email Contact Link */
        .contact-link {
            display: inline-block;
            margin-top: 0.5rem;
            color: #60a5fa;
            text-decoration: none;
            font-size: 0.9rem;
            font-weight: 400;
            letter-spacing: 0.02em;
            transition: color 0.2s ease;
        }

        .contact-link:hover {
            color: #93c5fd;
            text-decoration: underline;
        }

        /* Footer domain label */
        footer {
            z-index: 10;
            padding-bottom: 2.5rem;
            font-size: 0.85rem;
            color: #64748b;
            letter-spacing: 0.05em;
        }

        /* Animations */
        @keyframes fadeInDown {
            from { opacity: 0; transform: translateY(-20px); }
            to { opacity: 1; transform: translateY(0); }
        }

        @keyframes fadeInUp {
            from { opacity: 0; transform: translateY(20px); }
            to { opacity: 1; transform: translateY(0); }
        }
    </style>
</head>
<body>

    <!-- Ambient background glow -->
    <div class="glow-orb"></div>

    <!-- Minimal Top Coming Soon Badge (No Blinking) -->
    <header>
        <div class="badge">
            Coming Soon
        </div>
    </header>

    <!-- Background Giant Letter W -->
    <main>
        <div class="giant-w">W</div>
    </main>

    <!-- Foreground Main Content -->
    <div class="content-container">
        <h1 class="brand-title">wizrotech.com</h1>
        <p class="brand-subtitle">We are crafting something extraordinary. Stay tuned for the digital evolution of innovation and tech.</p>
        <a href="mailto:info@wizrotech.com" class="contact-link">info@wizrotech.com</a>
    </div>

    <!-- Footer Branding -->
    <footer>
        &copy; <span id="year"></span> Wizrotech. All rights reserved.
    </footer>

    <!-- Simple JavaScript for dynamic year -->
    <script>
        document.getElementById('year').textContent = new Date().getFullYear();
    </script>
</body>
</html>
